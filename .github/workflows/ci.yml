name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a release can require a green run on demand.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are exactly the versions pyproject claims in its classifiers.
        # Adding a classifier without adding it here makes the claim untested.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q

      - name: Type check
        run: python -m mypy src

      - name: Check formatting
        run: python -m black --target-version py311 --check src tests
